[nosetests]
tests=tests.test_models,tests.test_routes
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service
cover-min-percentage=80
cover-inclusive=1

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
count = True
statistics = True
show-source = True

[pylint]
disable=R,C
